<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Scanner</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #09090b;
      color: #fafafa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: radial-gradient(circle at top, #27272a 0, #09090b 48%);
    }

    main {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      min-height: 100dvh;
      margin-inline: auto;
      padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 { margin: 0; font-size: 1.35rem; }

    #status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #a1a1aa;
      font-size: .85rem;
    }

    #status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #71717a;
    }

    #status.active::before {
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    #sheetStatus { display: none; }

    .scanner {
      position: relative;
      overflow: hidden;
      flex: 0 0 auto;
      width: 100%;
      height: clamp(360px, 62dvh, 680px);
      min-height: 360px;
      border: 1px solid #3f3f46;
      border-radius: 24px;
      background: #18181b;
    }

    video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .frame {
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(72%, 300px);
      aspect-ratio: 1;
      translate: -50% -50%;
      border: 2px solid rgba(255, 255, 255, .82);
      border-radius: 22px;
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .4);
      pointer-events: none;
    }

    .line {
      position: absolute;
      left: 10%;
      right: 10%;
      height: 2px;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
      animation: scan 2.2s ease-in-out infinite alternate;
    }

    @keyframes scan {
      from { top: 10%; }
      to { top: 90%; }
    }

    .hint {
      position: absolute;
      inset: auto 16px 18px;
      margin: 0;
      text-align: center;
      color: #e4e4e7;
      font-size: .9rem;
      text-shadow: 0 1px 4px #000;
    }

    .result {
      display: none;
      gap: 10px;
      padding: 14px;
      border: 1px solid #3f3f46;
      border-radius: 16px;
      background: #18181b;
    }

    .result.show { display: grid; }
    .result small { color: #a1a1aa; }

    #validationMessage {
      font-size: 1.15rem;
      color: #facc15;
    }

    .result.valid {
      border-color: #16a34a;
      background: rgba(20, 83, 45, .38);
    }

    .result.valid #validationMessage { color: #86efac; }

    .result.invalid {
      border-color: #dc2626;
      background: rgba(127, 29, 29, .35);
    }

    .result.invalid #validationMessage { color: #fca5a5; }

    #personDetail {
      display: none;
      color: #d4d4d8;
      line-height: 1.55;
    }

    #personName {
      display: none;
      font-size: 1.35rem;
      color: #fff;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button, a.button {
      min-height: 48px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 14px;
      padding: 0 16px;
      background: #fafafa;
      color: #18181b;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button.secondary {
      border: 1px solid #3f3f46;
      background: #27272a;
      color: #fafafa;
    }

    button:disabled { opacity: .45; cursor: not-allowed; }
    canvas { display: none; }

    @media (max-width: 420px) {
      main {
        padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
        gap: 12px;
      }

      header { align-items: flex-start; }
      h1 { font-size: 1.15rem; }
      #status { font-size: .78rem; }
      .scanner {
        height: clamp(340px, 58dvh, 520px);
        min-height: 340px;
        border-radius: 18px;
      }
      .frame { width: min(76%, 280px); }
      .result { padding: 12px; }
      #validationMessage { font-size: 1rem; }
      #personName { font-size: 1.15rem; }
      button { min-height: 46px; padding-inline: 10px; }
    }

    @media (min-width: 600px) and (max-width: 899px) {
      main {
        padding-inline: 28px;
      }

      .frame { width: min(62%, 360px); }
      h1 { font-size: 1.6rem; }
    }

    @media (min-width: 900px) {
      main {
        max-width: 820px;
        padding: 28px 32px;
      }

      .scanner {
        height: clamp(480px, 68dvh, 720px);
      }

      .frame { width: min(56%, 400px); }
      .result { padding: 20px; }
      #validationMessage { font-size: 1.25rem; }
      #personName { font-size: 1.55rem; }
    }

    @media (orientation: landscape) and (max-height: 600px) {
      main {
        max-width: 680px;
        padding-block: 10px;
      }

      .scanner { height: 68vh; min-height: 300px; }
      .frame { width: min(52%, 260px); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>QR Scanner</h1>
      <div>
        <span id="status">ยังไม่เปิดกล้อง</span><br>
        <small id="sheetStatus">กำลังโหลดรายชื่อ...</small>
      </div>
    </header>

    <section class="scanner">
      <video id="video" playsinline muted></video>
      <div class="frame"><div class="line"></div></div>
      <p class="hint">วาง QR Code ให้อยู่ภายในกรอบ</p>
    </section>

    <section id="result" class="result">
      <strong id="validationMessage">กำลังตรวจสอบ...</strong>
      <strong id="personName"></strong>
      <span id="personDetail"></span>
    </section>

    <div class="actions">
      <button id="cameraButton">เปิดกล้อง</button>
      <button id="switchButton" class="secondary" disabled>สลับกล้อง</button>
    </div>
    <canvas id="canvas"></canvas>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const video = document.querySelector("#video");
    const canvas = document.querySelector("#canvas");
    const context = canvas.getContext("2d", { willReadFrequently: true });
    const status = document.querySelector("#status");
    const cameraButton = document.querySelector("#cameraButton");
    const switchButton = document.querySelector("#switchButton");
    const result = document.querySelector("#result");
    const validationMessage = document.querySelector("#validationMessage");
    const personName = document.querySelector("#personName");
    const personDetail = document.querySelector("#personDetail");
    const sheetStatus = document.querySelector("#sheetStatus");

    const SHEET_ID = "12AZf8zXGj5uSHlpD-Sdo37oQ1rN6Xh1hIx2Tt68TxM8";
    const SHEET_GID = "453783738";
    const CHECK_IN_ENDPOINT = "https://script.google.com/macros/s/AKfycbxJsCr_eKX83NKcBDLLsInJrFxqxSC2ZrMDVorq7xaco2bCil4qXhdaql-1kTsYtr34/exec";
    const registrations = new Map();
    let stream = null;
    let scanning = false;
    let facingMode = "environment";
    let lastValue = "";
    let lastDetectedAt = 0;
    let sheetLoaded = false;
    let pendingToken = "";

    function setStatus(text, active = false) {
      status.textContent = text;
      status.classList.toggle("active", active);
    }

    window.receiveSheetData = function (response) {
      if (response.status === "error") {
        sheetStatus.textContent = "โหลดรายชื่อไม่สำเร็จ";
        return;
      }

      registrations.clear();
      for (const row of response.table.rows) {
        const value = index => row.c[index]?.v?.toString().trim() || "";
        const token = value(6);
        if (!token) continue;
        registrations.set(token, {
          timestamp: value(0),
          email: value(1),
          firstName: value(2),
          lastName: value(3),
          status: value(4),
          ticketId: value(5)
        });
      }
      sheetLoaded = true;
      sheetStatus.textContent = `พร้อมตรวจสอบ ${registrations.size} รายการ`;

      if (pendingToken) {
        const registration = registrations.get(pendingToken);
        if (registration?.status === "checked_in") {
          showConfirmed(registration);
        } else {
          validationMessage.textContent = "✕ อัปเดตสถานะไม่สำเร็จ";
          personDetail.textContent = "กรุณาล็อกอิน Google ด้วยบัญชีที่มีสิทธิ์ แล้วลองอีกครั้ง";
          personDetail.style.display = "inline";
          result.classList.remove("valid");
          result.classList.add("invalid");
        }
        pendingToken = "";
      }
    };

    function loadSheetData() {
      const oldScript = document.querySelector("#sheetDataScript");
      if (oldScript) oldScript.remove();

      const query = encodeURIComponent("select A,B,C,D,F,G,H where H is not null");
      const script = document.createElement("script");
      script.id = "sheetDataScript";
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&headers=1&tqx=responseHandler:receiveSheetData&tq=${query}&_=${Date.now()}`;
      script.onerror = () => sheetStatus.textContent = "โหลดรายชื่อไม่สำเร็จ";
      document.body.appendChild(script);
    }

    function getCameraErrorMessage(error) {
      switch (error?.name) {
        case "NotAllowedError":
        case "SecurityError":
          return "เบราว์เซอร์ไม่อนุญาตให้ใช้กล้อง กรุณากดอนุญาตกล้องในการตั้งค่าเว็บไซต์ แล้วลองใหม่";
        case "NotFoundError":
        case "DevicesNotFoundError":
          return "ไม่พบกล้องในอุปกรณ์ กรุณาตรวจสอบว่ากล้องเชื่อมต่อและเปิดใช้งานอยู่";
        case "NotReadableError":
        case "TrackStartError":
          return "กล้องกำลังถูกใช้งานโดยโปรแกรมหรือแท็บอื่น กรุณาปิด Camera, OBS, Zoom, Meet หรือแท็บอื่น แล้วลองใหม่";
        case "OverconstrainedError":
        case "ConstraintNotSatisfiedError":
          return "กล้องไม่รองรับการตั้งค่าที่ร้องขอ กรุณาลองสลับกล้อง";
        case "AbortError":
          return "การเปิดกล้องถูกยกเลิก กรุณาลองใหม่";
        default:
          return "ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบสิทธิ์กล้องและลองใหม่";
      }
    }

    async function startCamera() {
      stopCamera();

      if (!navigator.mediaDevices?.getUserMedia) {
        setStatus("เบราว์เซอร์ไม่รองรับกล้อง");
        alert("เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง กรุณาใช้ Chrome, Edge หรือ Safari ผ่าน HTTPS");
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        scanning = true;
        cameraButton.textContent = "ปิดกล้อง";
        switchButton.disabled = false;
        setStatus("กำลังสแกน", true);
        requestAnimationFrame(scanFrame);
      } catch (error) {
        console.error("Unable to start camera:", error);
        setStatus("เปิดกล้องไม่สำเร็จ");
        alert(getCameraErrorMessage(error));
      }
    }

    function stopCamera() {
      scanning = false;
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      cameraButton.textContent = "เปิดกล้อง";
      switchButton.disabled = true;
      setStatus("ปิดกล้องแล้ว");
    }

    function scanFrame() {
      if (!scanning) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const image = context.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR?.(image.data, image.width, image.height, {
          inversionAttempts: "dontInvert"
        });

        if (code) showResult(code.data);
      }
      requestAnimationFrame(scanFrame);
    }

    function extractToken(value) {
      const trimmed = value.trim();
      try {
        const url = new URL(trimmed);
        return (url.searchParams.get("t") || url.searchParams.get("token") || trimmed).trim();
      } catch {
        return trimmed;
      }
    }

    function showConfirmed(registration) {
      validationMessage.textContent = "✓ ยืนยันการเข้างานสำเร็จ";
      personName.textContent = `${registration.firstName} ${registration.lastName}`.trim() || "ไม่ระบุชื่อ";
      personName.style.display = "inline";
      personDetail.textContent = [registration.ticketId, "checked_in"]
        .filter(Boolean)
        .join(" • ");
      personDetail.style.display = "inline";
      result.classList.remove("invalid");
      result.classList.add("valid");
    }

    async function checkIn(token) {
      pendingToken = token;
      validationMessage.textContent = "กำลังยืนยันการเข้างาน...";
      result.classList.remove("valid", "invalid");

      if (location.protocol === "file:") {
        pendingToken = "";
        validationMessage.textContent = "QR ถูกต้อง แต่ยังเช็คอินไม่ได้";
        personDetail.textContent = "กรุณาเปิดระบบผ่าน http://localhost:4651";
        personDetail.style.display = "inline";
        result.classList.add("invalid");
        return;
      }

      try {
        await fetch(`${CHECK_IN_ENDPOINT}?t=${encodeURIComponent(token)}`, {
          mode: "no-cors",
          credentials: "include",
          cache: "no-store"
        });
      } catch {
        // การตอบกลับแบบ no-cors อ่านค่าไม่ได้ จึงตรวจผลจริงจากชีตด้านล่าง
      }

      setTimeout(loadSheetData, 1800);
    }

    function showResult(value) {
      const now = Date.now();
      if (value === lastValue && now - lastDetectedAt < 2500) return;
      lastValue = value;
      lastDetectedAt = now;
      result.classList.add("show");
      result.classList.remove("valid", "invalid");

      const token = extractToken(value);
      const registration = registrations.get(token);
      if (!sheetLoaded) {
        validationMessage.textContent = "กำลังโหลดรายชื่อ กรุณาสแกนอีกครั้ง";
        personName.style.display = "none";
        personDetail.style.display = "none";
      } else if (registration) {
        if (registration.status === "checked_in") {
          showConfirmed(registration);
        } else {
          personName.textContent = `${registration.firstName} ${registration.lastName}`.trim() || "ไม่ระบุชื่อ";
          personName.style.display = "inline";
          personDetail.style.display = "none";
          checkIn(token);
        }
      } else {
        validationMessage.textContent = "✕ ไม่สามารถยืนยันการเข้างาน";
        personName.textContent = "ไม่พบข้อมูลใน Google Sheet";
        personName.style.display = "inline";
        personDetail.style.display = "none";
        result.classList.add("invalid");
      }

      if (navigator.vibrate) navigator.vibrate(120);
    }

    cameraButton.addEventListener("click", () => {
      scanning ? stopCamera() : startCamera();
    });

    switchButton.addEventListener("click", async () => {
      facingMode = facingMode === "environment" ? "user" : "environment";
      await startCamera();
    });

    window.addEventListener("pagehide", stopCamera);
    loadSheetData();
    setInterval(loadSheetData, 60000);
  </script>
</body>
</html>
